version: '3.9'

services:
  mongodb:
    image: mongo:7
    container_name: taskmanager_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secret
      MONGO_INITDB_DATABASE: taskmanager
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - taskmanager_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskmanager_backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://admin:secret@mongodb:27017/taskmanager?authSource=admin
      JWT_SECRET: change_this_in_production_minimum_32_chars
      JWT_EXPIRE: 7d
      JWT_REFRESH_SECRET: change_refresh_secret_in_production
      JWT_REFRESH_EXPIRE: 30d
      CLIENT_URL: http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    networks:
      - taskmanager_net
    volumes:
      - ./backend/logs:/app/logs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taskmanager_frontend
    restart: unless-stopped
    environment:
      REACT_APP_API_URL: http://localhost:5000/api/v1
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - taskmanager_net

volumes:
  mongodb_data:

networks:
  taskmanager_net:
    driver: bridge
